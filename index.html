<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Математический тест — 20 уровней</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10121c;color:#fff;font-family:Arial,sans-serif;min-height:100vh}
.container{max-width:780px;margin:auto;padding:25px 16px}
h1{text-align:center;color:#958cff;margin-bottom:8px}
.subtitle{text-align:center;color:#aaa;line-height:1.5}
.panel{background:#1c2030;padding:24px;border-radius:18px;margin-top:20px;box-shadow:0 12px 35px #0003}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{border:0;border-radius:10px;padding:14px;cursor:pointer;font-size:15px;font-weight:bold;transition:.18s}
.level{background:#30364d;color:white;min-height:58px}
.level:hover:not(:disabled){background:#6559d9;transform:translateY(-2px)}
.level:disabled{opacity:.32;cursor:not-allowed}
.answer{display:block;width:100%;margin:10px 0;background:#30364d;color:white;text-align:left}
.answer:hover:not(:disabled){background:#5148a8}
.answer.correct{background:#168653}
.answer.wrong{background:#b83c4c}
.primary{background:#7467ee;color:white;width:100%;margin-top:15px}
.primary:hover{background:#9187ff}
.progress{background:#30364d;height:10px;border-radius:10px;overflow:hidden;margin:15px 0}
.bar{height:100%;background:#8175ff;width:0%;transition:.3s}
.question{font-size:23px;line-height:1.4;margin:25px 0}
.info{color:#aaa;line-height:1.5}
.hidden{display:none}
.result{text-align:center}
.result h1{font-size:42px}
.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#aaa}
@media(max-width:520px){.levels{grid-template-columns:repeat(2,1fr)}.panel{padding:18px}.question{font-size:20px}}
</style>
</head>
<body>
<div class="container">
<h1>∑ Математический тест</h1>
<p class="subtitle">20 уровней · 160 вопросов · От базовой арифметики до высшей математики</p>

<div class="panel" id="menu">
  <h2>Выбери уровень</h2>
  <p class="info">Выбирай любой уровень в любом порядке. Для успешного прохождения уровня нужно правильно ответить минимум на 6 вопросов из 8.</p>
  <div class="levels" id="levels"></div>
  <p class="info" id="best"></p>
</div>

<div class="panel hidden" id="game">
  <div class="topline"><span id="levelName"></span><span id="counter"></span></div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="question" id="question"></div>
  <div id="answers"></div>
  <p id="feedback" aria-live="polite"></p>
  <button class="primary hidden" id="next" onclick="nextQuestion()">Далее →</button>
</div>

<div class="panel hidden result" id="result">
  <h2 id="resultTitle"></h2>
  <h1 id="score"></h1>
  <p id="resultText"></p>
  <button class="primary" onclick="backToMenu()">Вернуться к уровням</button>
  <button class="primary" id="retry" onclick="startLevel(currentLevel)">Повторить уровень</button>
</div>
</div>

const names = [
"Начальный","Лёгкий","Средний","Выше среднего",
"Продвинутый","Сложный","Эксперт","Экстремальный",
"Высшая алгебра","Тригонометрия PRO","Математический анализ",
"Интегральное исчисление","Теория пределов","Матричная алгебра",
"Комплексные числа","Теория вероятностей","Продвинутая теория чисел",
"Дифференциальные уравнения","Многомерная математика","Абсолютный математический ад"
];

let unlocked = Math.min(20, Math.max(1, Number(localStorage.getItem("mathUnlocked") || 1)));
let currentLevel = 0, currentQuestion = 0, correct = 0, answered = false;

function renderLevels(){
  const container=document.getElementById("levels");
  container.innerHTML="";
  names.forEach((name,i)=>{
    const b=document.createElement("button");
    b.className="level";
    b.textContent=(i+1)+". "+name;
    b.disabled=false;
    b.onclick=()=>startLevel(i);
    container.appendChild(b);
  });
  document.getElementById("best").textContent="Доступны все 20 уровней · 160 вопросов";
}
function startLevel(level){
  currentLevel=level; currentQuestion=0; correct=0;
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  document.getElementById("retry").classList.add("hidden");
  showQuestion();
}
function showQuestion(){
  answered=false;
  const q=tests[currentLevel][currentQuestion];
  document.getElementById("levelName").textContent="Уровень "+(currentLevel+1)+" — "+names[currentLevel];
  document.getElementById("counter").textContent="Вопрос "+(currentQuestion+1)+" из 8";
  document.getElementById("bar").style.width=(currentQuestion/8*100)+"%";
  document.getElementById("question").textContent=q[0];
  document.getElementById("feedback").textContent="";
  document.getElementById("next").classList.add("hidden");
  const answers=document.getElementById("answers"); answers.innerHTML="";
  q[1].forEach((answer,index)=>{
    const b=document.createElement("button");
    b.className="answer";
    b.textContent=String.fromCharCode(65+index)+". "+answer;
    b.onclick=()=>selectAnswer(index,b);
    answers.appendChild(b);
  });
}
function selectAnswer(index,button){
  if(answered)return;
  answered=true;
  const q=tests[currentLevel][currentQuestion];
  document.querySelectorAll(".answer").forEach((b,i)=>{
    b.disabled=true;
    if(i===q[2])b.classList.add("correct");
  });
  if(index===q[2]){
    correct++;
    document.getElementById("feedback").textContent="✓ Правильно!";
  }else{
    button.classList.add("wrong");
    document.getElementById("feedback").textContent="✗ Неправильно. Правильный ответ: "+q[1][q[2]];
  }
  document.getElementById("bar").style.width=((currentQuestion+1)/8*100)+"%";
  document.getElementById("next").classList.remove("hidden");
}
function nextQuestion(){
  currentQuestion++;
  if(currentQuestion<8)showQuestion(); else finishLevel();
}
function finishLevel(){
  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  const passed=correct>=6;
  document.getElementById("resultTitle").textContent=passed?"Уровень пройден!":"Уровень не пройден";
  document.getElementById("score").textContent=correct+" / 8";
  let message=passed
    ?"Отличная работа! Ты набрал не менее 6 правильных ответов."
    :"Нужно набрать минимум 6 правильных ответов из 8. Попробуй ещё раз.";
  if(passed && currentLevel===19){
    document.getElementById("resultTitle").textContent="ПОЗДРАВЛЯЕМ! ВСЕ 20 УРОВНЕЙ ПРОЙДЕНЫ!";
    message="Ты прошёл все 160 математических вопросов. Это выдающийся результат!";
  }
  document.getElementById("resultText").textContent=message;
  document.getElementById("retry").classList.remove("hidden");
}
function backToMenu(){
  document.getElementById("result").classList.add("hidden");
  document.getElementById("menu").classList.remove("hidden");
  renderLevels();
}
renderLevels();
</script>
</body>
</html>
